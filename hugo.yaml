baseURL: https://example.github.io/uczenie-glebokie-inz/
languageCode: pl-PL
title: Uczenie Głębokie
disableKinds: [taxonomy, term, RSS, sitemap, robotsTXT]

module:
  hugoVersion:
    extended: true
    min: "0.120.0"

# Disable HTML minification. The minifier self-closes <script> tags
# ("<script/>") which is invalid in HTML5 and swallows the rest of the
# document as script content. CSS/JS minification stays enabled.
minify:
  disableHTML: true

params:
  # Sekcja „Warsztat inżyniera ML” — tymczasowo ukryta; ustaw true, by przywrócić.
  showTools: false
  # Przełącznik PL/EN — tymczasowo wyłączony; ustaw true, by przywrócić wersję angielską.
  enableEnglish: false
  description: Uczenie Głębokie — kurs na kierunku Sztuczna Inteligencja, Politechnika Wrocławska. Program wykładów i laboratoriów, zespół, literatura.
  github: https://github.com/
