blocks:
  - roman: I
    title: Podstawy sieci neuronowych
    title_en: Neural network foundations
    hours: "8 h"
    accent: indigo
    summary_pl: "Perceptron wielowarstwowy i propagacja wsteczna: najpierw krok po kroku, potem w zapisie macierzowym. Dalej regularyzacja, optymalizatory i strojenie hiperparametrów, czyli to, od czego zależy, czy sieć faktycznie się uczy i uogólnia."
    summary_en: "The multilayer perceptron and backpropagation, first step by step, then in matrix form. Then regularisation, optimisers and hyperparameter tuning: what decides whether a network actually learns and generalises."
    items:
      - nr: "1"
        topic: Płytka sieć MLP i uczenie metodą propagacji wstecznej
        hours: "2 h"
      - nr: "2"
        topic: Algorytm propagacji wstecznej w ujęciu macierzowym
        hours: "2 h"
      - nr: "3–4"
        topic: Techniki poprawiające uczenie i uogólnianie — regularyzacja, optymalizacja, strojenie hiperparametrów
        hours: "4 h"
    tags: [MLP, Backprop, SGD, Adam, Dropout, BatchNorm]

  - roman: II
    title: Sieci konwolucyjne i modele generatywne
    title_en: Convolutional networks & generative models
    hours: "6 h"
    accent: plum
    summary_pl: "Sieci konwolucyjne: splot, pooling, klasyczne architektury i uczenie transferowe. Następnie autokodery i reprezentacja ukryta, a na ich bazie modele generatywne: VAE i GAN."
    summary_en: "Convolutional networks: convolution, pooling, classic architectures and transfer learning. Then autoencoders and latent representations, and on top of them generative models: VAE and GAN."
    items:
      - nr: "5"
        topic: Sieci konwolucyjne — architektura, uczenie transferowe, przegląd znanych architektur
        hours: "2 h"
      - nr: "6"
        topic: Autokoder, reprezentacja ukryta i uczenie nienadzorowane
        hours: "2 h"
      - nr: "7"
        topic: Wprowadzenie do sieci generatywnych (VAE, GAN)
        hours: "2 h"
    tags: [CNN, ResNet, Transfer Learning, Autoencoder, VAE, GAN]

  - roman: III
    title: Sieci sekwencyjne, mechanizm uwagi i Transformery
    title_en: Sequence models, attention & Transformers
    hours: "4 h"
    accent: ochre
    summary_pl: "Modele sekwencyjne od RNN, LSTM i GRU oraz seq2seq po Transformer, w którym rekurencję zastępują mechanizm uwagi i kodowanie pozycyjne."
    summary_en: "Sequence models from RNN, LSTM, GRU and seq2seq to the Transformer, where attention and positional encoding replace recurrence."
    items:
      - nr: "8"
        topic: Sieci rekurencyjne i ich zastosowania (NLP, mowa) — LSTM, GRU, sieci dwukierunkowe, seq2seq
        hours: "2 h"
      - nr: "9–10"
        topic: Mechanizm uwagi i Transformer — architektura, zasada działania, kodowanie pozycyjne
        hours: "4 h"
    tags: [RNN, LSTM, Attention, Self-Attention, Transformer, BERT, GPT]

  - roman: IV
    title: Tematy zaawansowane
    title_en: Advanced topics
    hours: "12 h"
    accent: forest
    summary_pl: "Trzy tematy wykraczające poza podstawy: uczenie ze wzmocnieniem z głębokimi sieciami (DQN, gradient polityki), interpretacja decyzji sieci oraz detekcja i segmentacja obiektów na obrazach."
    summary_en: "Three topics beyond the basics: reinforcement learning with deep networks (DQN, policy gradient), interpreting network decisions, and object detection and segmentation in images."
    items:
      - nr: "11–12"
        topic: Uczenie ze wzmocnieniem z użyciem sieci głębokich
        hours: "4 h"
      - nr: "13"
        topic: Metody interpretacji sieci neuronowych
        hours: "2 h"
      - nr: "14–15"
        topic: Zastosowania sieci konwolucyjnych — detekcja i segmentacja
        hours: "4 h"
    tags: [Deep RL, DQN, Policy Gradient, Grad-CAM, YOLO, U-Net]
