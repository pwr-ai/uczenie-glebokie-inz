blocks:
  - roman: I
    title: Podstawy sieci neuronowych
    title_en: Neural network foundations
    hours: "8 h"
    accent: indigo
    summary_pl: "Jak zbudowana jest sieć w pełni połączona i jak działa propagacja wsteczna, od pojedynczego neuronu po zapis macierzowy. Druga część bloku wyjaśnia, dlaczego sieć się przeucza albo nie zbiega i jak temu zaradzić regularyzacją, doborem optymalizatora i strojeniem hiperparametrów."
    summary_en: "How a fully connected network is built and how backpropagation works, from a single neuron to the matrix formulation. The second part of the block explains why a network overfits or fails to converge, and how to fix it with regularisation, the choice of optimiser and hyperparameter tuning."
    items:
      - nr: "1"
        topic: Płytka sieć MLP i uczenie metodą propagacji wstecznej
        hours: "2 h"
      - nr: "2"
        topic: Algorytm propagacji wstecznej w ujęciu macierzowym
        hours: "2 h"
      - nr: "3–4"
        topic: Techniki poprawiające uczenie i uogólnianie — regularyzacja, optymalizacja, strojenie hiperparametrów
        hours: "4 h"
    tags: [MLP, Backprop, SGD, Adam, Dropout, BatchNorm]

  - roman: II
    title: Sieci konwolucyjne i modele generatywne
    title_en: Convolutional networks & generative models
    hours: "6 h"
    accent: plum
    summary_pl: "Sieci konwolucyjne: splot, pooling, klasyczne architektury i uczenie transferowe. Następnie autokodery i reprezentacja ukryta, a na ich podstawie modele generatywne, czyli VAE i GAN."
    summary_en: "Convolutional networks: convolution, pooling, classic architectures and transfer learning. Then autoencoders and latent representations, and building on them the generative models VAE and GAN."
    items:
      - nr: "5"
        topic: Sieci konwolucyjne — budowa, uczenie transferowe, przegląd znanych architektur
        hours: "2 h"
      - nr: "6"
        topic: Autokoder, reprezentacja ukryta i uczenie nienadzorowane
        hours: "2 h"
      - nr: "7"
        topic: Wprowadzenie do sieci generatywnych (VAE, GAN)
        hours: "2 h"
    tags: [CNN, ResNet, Transfer Learning, Autoencoder, VAE, GAN]

  - roman: III
    title: Modele sekwencyjne, mechanizm uwagi i Transformery
    title_en: Sequence models, attention & Transformers
    hours: "4 h"
    accent: ochre
    summary_pl: "Rozwój modeli sekwencyjnych: od sieci RNN, LSTM i GRU oraz seq2seq po architekturę Transformera, w której rekurencję zastępują mechanizm uwagi i kodowanie pozycyjne."
    summary_en: "The evolution of sequence models: from RNN, LSTM and GRU networks and seq2seq to the Transformer architecture, where attention and positional encoding replace recurrence."
    items:
      - nr: "8"
        topic: Sieci rekurencyjne i ich zastosowania (NLP, mowa) — LSTM, GRU, sieci dwukierunkowe, seq2seq
        hours: "2 h"
      - nr: "9–10"
        topic: Mechanizm uwagi i Transformer — architektura, kodowanie pozycyjne
        hours: "4 h"
    tags: [RNN, LSTM, Attention, Self-Attention, Transformer, BERT, GPT]

  - roman: IV
    title: Tematy zaawansowane
    title_en: Advanced topics
    hours: "12 h"
    accent: forest
    summary_pl: "Głębokie uczenie ze wzmocnieniem (DQN, gradient polityki), metody interpretacji sieci neuronowych oraz detekcja i segmentacja obiektów na obrazach."
    summary_en: "Deep reinforcement learning (DQN, policy gradient), methods for interpreting neural networks, and object detection and segmentation in images."
    items:
      - nr: "11–12"
        topic: Głębokie uczenie ze wzmocnieniem (Deep RL)
        hours: "4 h"
      - nr: "13"
        topic: Metody interpretacji sieci neuronowych
        hours: "2 h"
      - nr: "14–15"
        topic: Detekcja i segmentacja obiektów na obrazach
        hours: "4 h"
    tags: [Deep RL, DQN, Policy Gradient, Grad-CAM, YOLO, U-Net]
