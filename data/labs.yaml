blocks:
  - roman: I
    title: Podstawy, PyTorch i dobre praktyki
    title_en: Foundations, PyTorch & good practice
    range: Lab 1–5
    accent: indigo
    lead_name: dr inż. Kamil Tagowski
    lead_color: indigo
    items:
      - nr: "1"
        topic: NumPy — operacje macierzowe
        details: Operacje na macierzach, broadcasting, wektoryzacja
      - nr: "2"
        topic: Sieć neuronowa w NumPy od zera
        details: Przebieg w przód i wstecz zaimplementowane bez bibliotek DL
      - nr: "3"
        topic: Sieć w NumPy — ciąg dalszy
        details: Regularyzacja, dropout, inicjalizacja wag
      - nr: "4"
        topic: Ta sama sieć w PyTorch
        details: Przejście na PyTorch — autograd, moduły, DataLoader
      - nr: "5"
        topic: Dobre praktyki i śledzenie eksperymentów
        details: Weights & Biases lub MLflow, porównywanie przebiegów, reprodukowalność

  - roman: II
    title: Sieci konwolucyjne, modele generatywne i Deep RL
    title_en: ConvNets, generative models & Deep RL
    range: Lab 6–10
    accent: plum
    lead_name: dr inż. Piotr Zieliński
    lead_color: plum
    items:
      - nr: "6"
        topic: Sieci konwolucyjne
        details: Splot 2D i 3D, wizualizacja filtrów i map aktywacji
      - nr: "7"
        topic: Sieci konwolucyjne — regularyzacja
        details: Augmentacja danych, uczenie transferowe, wczesne zatrzymanie
      - nr: "8"
        topic: Autokoder, VAE, GAN
        details: Modele generatywne — implementacja i porównanie
      - nr: "9"
        topic: Deep RL — podstawy
        details: Gradient polityki, DQN
      - nr: "10"
        topic: Deep RL — ciąg dalszy
        details: Actor-Critic, zastosowania

  - roman: III
    title: Sieci sekwencyjne, Transformery, wyjaśnialność i ataki adwersarialne
    title_en: Sequence models, Transformers, explainability & adversarial attacks
    range: Lab 11–15
    accent: teal
    lead_name: mgr inż. Jan Jakubik
    lead_color: teal
    items:
      - nr: "11"
        topic: Sieci rekurencyjne
        details: RNN, LSTM, GRU — implementacja i zastosowania
      - nr: "12"
        topic: Mechanizm uwagi
        details: Self-attention, cross-attention, wizualizacja wag uwagi
      - nr: "13"
        topic: Transformery
        details: Architektura Transformera, kodowanie pozycyjne, implementacja
      - nr: "14"
        topic: Wyjaśnialność i bezpieczeństwo
        details: "Grad-CAM, SHAP, LIME; bezpieczeństwo modeli"
      - nr: "15"
        topic: Ataki adwersarialne
        details: FGSM, PGD, obrona przed atakami
