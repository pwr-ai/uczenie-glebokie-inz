blocks:
  - roman: I
    title: Podstawy i PyTorch
    title_en: Foundations & PyTorch
    range: Lab 1–5
    accent: indigo
    lead_name: dr inż. Kamil Tagowski
    lead_color: indigo
    items:
      - nr: "1"
        topic: NumPy — operacje macierzowe
        details: Operacje na macierzach, broadcasting, wektoryzacja
      - nr: "2"
        topic: Sieć neuronowa w NumPy od zera
        details: Implementacja przebiegu w przód i wstecz
      - nr: "3"
        topic: Sieć w NumPy — ciąg dalszy
        details: Regularyzacja, dropout, inicjalizacja wag
      - nr: "4"
        topic: Sieć neuronowa w PyTorch
        details: Autograd, nn.Module, DataLoader
      - nr: "5"
        topic: Dobre praktyki i śledzenie eksperymentów
        details: Weights & Biases lub MLflow, porównywanie eksperymentów, reprodukowalność

  - roman: II
    title: Obrazy, generowanie i Deep RL
    title_en: Images, generation & Deep RL
    range: Lab 6–10
    accent: plum
    lead_name: dr inż. Piotr Zieliński
    lead_color: plum
    items:
      - nr: "6"
        topic: Sieci konwolucyjne
        details: Splot 2D i 3D, wizualizacja filtrów i map aktywacji
      - nr: "7"
        topic: Sieci konwolucyjne — regularyzacja i uczenie transferowe
        details: Augmentacja danych, uczenie transferowe, wczesne zatrzymanie
      - nr: "8"
        topic: Autokoder, VAE, GAN
        details: Modele generatywne — implementacja i porównanie
      - nr: "9"
        topic: Deep RL — podstawy
        details: Gradient polityki, DQN
      - nr: "10"
        topic: Deep RL — ciąg dalszy
        details: Actor-Critic, zastosowania

  - roman: III
    title: Sekwencje, wyjaśnialność i ataki
    title_en: Sequences, explainability & attacks
    range: Lab 11–15
    accent: teal
    lead_name: mgr inż. Jan Jakubik
    lead_color: teal
    items:
      - nr: "11"
        topic: Sieci rekurencyjne
        details: RNN, LSTM, GRU — implementacja i zastosowania
      - nr: "12"
        topic: Mechanizm uwagi
        details: Self-attention, cross-attention, wizualizacja wag uwagi
      - nr: "13"
        topic: Transformery
        details: Architektura, kodowanie pozycyjne, implementacja
      - nr: "14"
        topic: Wyjaśnialność i bezpieczeństwo
        details: "XAI: Grad-CAM, SHAP, LIME. Bezpieczeństwo modeli"
      - nr: "15"
        topic: Ataki adwersarialne
        details: FGSM, PGD, obrona przed atakami
